name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks (type, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify generated curriculum bundle is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch supabase/seeds/official-curriculum-complete.sql > /dev/null 2>&1; then
            echo "::error::supabase/seeds/official-curriculum-complete.sql must not be tracked in Git"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run static, type, unit, and build checks
        run: npm run test:ci

      - name: Upload static-check failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            coverage/
            playwright-report/

  integration:
    name: Local Supabase integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # These values are disposable credentials for the local Supabase stack.
    # They are deliberately not repository or production secrets.
    env:
      CI: true
      E2E_EMAIL: phase55-e2e-teacher@example.test
      E2E_PASSWORD: Phase55-local-e2e-password-9!
      E2E_FULL_NAME: Phase 5.5 E2E Teacher
      E2E_SCHOOL_NAME: Phase 5.5 Local School
      E2E_SECTIONS: Phase 5.5 E2E Section
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_AUTH_STATE_FILE: /tmp/gurodesk-playwright-auth.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL client for behavioral migration assertions
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install Chromium for local E2E tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start the one local Supabase stack
        run: ./node_modules/.bin/supabase start

      - name: Map local Supabase status to test environment
        shell: bash
        run: |
          set -Eeuo pipefail

          status_file="${RUNNER_TEMP}/gurodesk-supabase-status.env"
          ./node_modules/.bin/supabase status -o env > "${status_file}"

          read_status_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" "${status_file}" | head -n 1)"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            printf '%s' "${value}"
          }

          api_url="$(read_status_value API_URL)"
          anon_key="$(read_status_value ANON_KEY)"
          service_role_key="$(read_status_value SERVICE_ROLE_KEY)"
          db_url="$(read_status_value DB_URL)"

          # Do not let a malformed status response route tests to a hosted
          # project.  Only the local Supabase API and database are accepted.
          case "${api_url}" in
            http://127.0.0.1:*|http://localhost:*|http://\[::1\]:*) ;;
            *) echo "Supabase API_URL is not local: ${api_url}" >&2; exit 1 ;;
          esac
          case "${db_url}" in
            *@127.0.0.1:*|*@localhost:*|*@\[::1\]:*) ;;
            *) echo "Supabase DB_URL is not local" >&2; exit 1 ;;
          esac
          test -n "${anon_key}"
          test -n "${service_role_key}"

          # The status file contains keys generated by the disposable local
          # stack.  Mask them in case a later diagnostic prints an environment
          # value, while keeping production credentials out of this workflow.
          echo "::add-mask::${anon_key}"
          echo "::add-mask::${service_role_key}"

          {
            printf 'VITE_SUPABASE_URL=%s\n' "${api_url}"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "${anon_key}"
            printf 'SUPABASE_URL=%s\n' "${api_url}"
            printf 'SUPABASE_ANON_KEY=%s\n' "${anon_key}"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "${service_role_key}"
            printf 'SUPABASE_DB_URL=%s\n' "${db_url}"
            printf 'E2E_SUPABASE_URL=%s\n' "${api_url}"
            printf 'E2E_SUPABASE_PUBLISHABLE_KEY=%s\n' "${anon_key}"
            printf 'E2E_SUPABASE_ANON_KEY=%s\n' "${anon_key}"
          } >> "${GITHUB_ENV}"

      - name: Run fresh migration test
        run: npm run test:db:fresh

      - name: Run upgrade migration test
        run: npm run test:db:upgrade

      - name: Restore final all-migrations local stack
        run: ./node_modules/.bin/supabase db reset --local --yes

      - name: Create deterministic local E2E teacher
        run: npm run test:e2e:prepare

      - name: Run local Supabase integration tests
        run: npm run test:integration

      - name: Run local Chromium E2E tests
        run: npm run test:e2e

      - name: Upload local Supabase and Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-supabase-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            /tmp/gurodesk-playwright-results/

      - name: Stop local Supabase (always)
        if: always()
        continue-on-error: true
        run: ./node_modules/.bin/supabase stop --no-backup
